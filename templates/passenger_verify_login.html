{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 50px auto;">
    <h3 style="text-align: center; margin-bottom: 20px;">Verify Your Identity</h3>
    
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Enter 6-Digit OTP</label>
            <input type="text" name="otp_code" required style="font-size: 20px; letter-spacing: 5px; text-align: center;">
        </div>
        <button type="submit" class="btn btn-success" style="width: 100%;">Login to Profile</button>
    </form>
</div>
{% endblock %}
